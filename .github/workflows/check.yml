name: check
on:
  push:
    branches:
      - main
      - master
      - develop
      - 'updates/**'
      - 'feature/**'
      - 'features/**'
  workflow_dispatch:
env:
  PROJECT_NAME: EL_learner
  WORKFLOW: check
jobs:
  run-unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - '3.12.3'
    runs-on: ${{ matrix.os }}
    name: Run tests on Python ${{ matrix.python-version }}, on ${{ matrix.os }}
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-run-unit-tests-${{ matrix.python-version }}-${{ matrix.os }}-${{ github.event.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore Python dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Download ELK reasoner jar
        run: |
          curl -L -o java/elk-owlapi-standalone-0.4.2.jar https://repo1.maven.org/maven2/org/semanticweb/elk/elk-owlapi-standalone/0.4.2/elk-owlapi-standalone-0.4.2-bin.jar
        shell: bash

      - name: Compile OWLGateway.java
        run: |
          python3 -c "
          import sys, subprocess
          sys.path.insert(0, '.')
          from utils.java_utils import build_classpath
          cp = build_classpath('java')
          subprocess.run(['javac', '--release', '11', '-cp', cp, 'java/OWLGateway.java'], check=True)
          "
        shell: bash

      - name: Run tests with coverage
        # Both reasoners, as locally; the second run adds to the first one's coverage.
        run: |
          pytest --cov=learner --cov=utils --cov-report=xml
          pytest --cov=learner --cov=utils --cov-append --cov-report=xml --reasoner=hermit
        shell: bash

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          env_vars: OS,PYTHON
          fail_ci_if_error: true
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          verbose: false